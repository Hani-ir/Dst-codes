  :root{
    --radius: 0.75rem;
    --background: oklch(0.08 0.005 260);
    --foreground: oklch(0.97 0.005 240);
    --muted-foreground: oklch(0.68 0.02 250);
    --border: oklch(1 0 0 / 10%);
    --cyan: oklch(0.88 0.15 200);
    --cyan-light: oklch(0.88 0.15 200);  /* فیروزه‌ای روشن */
    --cyan-matte: oklch(0.62 0.06 200);  /* فیروزه‌ای مات */
    --cyan-bright: oklch(0.85 0.22 195); /* فیروزه‌ای براق */
    --crimson: oklch(0.62 0.24 22);
    --violet: oklch(0.58 0.25 295);
    --gradient-synth: linear-gradient(100deg, var(--cyan), var(--violet) 55%, var(--crimson));
    --font-display: "Helvetica LT", "Unbounded", sans-serif;
    --font-sans: "Helvetica LT", "Space Grotesk", sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--background);
    color:var(--foreground);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  ::selection{background:var(--cyan);color:#001018}

  .text-gradient-synth{
    background:var(--gradient-synth);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    animation:synth-shift 6s ease-in-out infinite alternate;
  }
  .shadow-glow-cyan{ box-shadow:0 0 12px var(--cyan), 0 0 30px color-mix(in oklab, var(--cyan) 50%, transparent); }
  .btn-glow{
    position:relative;color:oklch(0.1 0.02 240);
    background:var(--gradient-synth);background-size:200% 100%;
    box-shadow:0 0 20px -2px color-mix(in oklab, var(--cyan) 60%, transparent), 0 0 40px -8px color-mix(in oklab, var(--violet) 60%, transparent);
    transition:transform .3s ease, box-shadow .3s ease, background-position .6s ease;
  }
  .btn-glow:hover{
    transform:translateY(-2px); background-position:100% 0;
    box-shadow:0 0 30px 0 color-mix(in oklab, var(--cyan) 70%, transparent), 0 0 60px -6px color-mix(in oklab, var(--crimson) 60%, transparent);
  }
  .btn-glow:active{ transform:scale(.97) }

  .hero-vignette{
    background:
      radial-gradient(circle at 70% 45%, color-mix(in oklab, var(--violet) 14%, transparent), transparent 45%),
      radial-gradient(circle at 85% 80%, color-mix(in oklab, var(--crimson) 10%, transparent), transparent 40%),
      linear-gradient(90deg, var(--background) 0%, transparent 55%);
  }
  @keyframes synth-shift{ from{background-position:0% 0} to{background-position:100% 0} }

  /* ---------------- header (v3: no glass pill, no center nav) ---------------- */
  header.site{
    position:fixed;inset-inline:0;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:24px 24px;
    opacity:0;transform:translateY(-20px);
    animation:headerIn .8s cubic-bezier(.2,.8,.2,1) .05s forwards;
  }
  @keyframes headerIn{ to{opacity:1;transform:translateY(0)} }
  @media (min-width:768px){ header.site{ padding:24px 40px } }
  .wordmark{
    font-family:var(--font-display);font-size:21.6px;font-weight:700;letter-spacing:-.01em;
    display:inline-block;
    animation:
      wordmark-color 6s ease-in-out infinite,
      wordmark-wave 3.2s ease-in-out infinite;
  }
  @media (min-width:768px){ .wordmark{ font-size:24px } }
  @keyframes wordmark-color{
    0%, 100%{ color:#73520f }
    33%{ color:#ffd659 }
    66%{ color:#ff730d }
  }
  @keyframes wordmark-wave{
    0%, 100%{ transform:translateY(0) }
    50%{ transform:translateY(-2px) }
  }
  .init-btn{ border-radius:999px;padding:8px 20px;font-family:var(--font-display);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.25em }

  /* ---------------- hero ---------------- */
  section.hero{ position:relative;height:500vh }
  .hero-sticky{ position:sticky;top:0;height:100vh;overflow:hidden }
  canvas#field{ position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none }

  /* right-side vertical nav (moved out of the header in v3) */
  .side-nav{
    position:absolute;right:24px;top:20%;transform:translateY(-50%);z-index:10;
    display:none;flex-direction:column;align-items:flex-end;gap:20px;
    opacity:0;transition:opacity .8s ease .5s;
  }
  .side-nav.show{ opacity:1 }
  @media (min-width:768px){ .side-nav{ display:flex;right:40px } }
  .side-nav a{
    display:flex;align-items:center;gap:10px;
    font-size:11.2px;font-weight:500;text-transform:uppercase;letter-spacing:.15em;
    color:color-mix(in oklab, var(--foreground) 80%, transparent);transition:color .2s ease;
  }
  .side-nav a:hover{ color:var(--foreground) }
  .side-nav a .dot, .mobile-nav a .dot{
    width:6px;height:6px;border-radius:50%;
    animation:navdot-cycle 3s linear infinite;
    transition:transform .3s ease;
  }
  .side-nav a:hover .dot{ transform:scale(1.5) }
  /* ~1s per color, but blended smoothly (not a hard cut) into the next: light cyan -> matte cyan -> bright cyan -> repeat */
  @keyframes navdot-cycle{
    0%     { background:var(--cyan-light);  box-shadow:0 0 12px var(--cyan-light),  0 0 30px color-mix(in oklab, var(--cyan-light) 50%, transparent) }

<script type="module">
import * as THREE from "three";

/* ==========================================================================================
   Ported 1:1 from the uploaded SYNTH/X source (v3):
   - src/components/synthesis/shapes.ts   -> shape generators (maskShape/brainShape/boneShape/skullShape)
   - src/components/synthesis/imageShape.ts -> traces the DST Lubestation logo into particles
   - src/components/synthesis/ParticleField.tsx -> GLSL shaders, main Points + ambient Halo, mouse reactivity
   - src/components/synthesis/Hero.tsx    -> 4-stage scroll copy, right-side nav, rotating captions
   - src/components/synthesis/Header.tsx  -> plain wordmark + Initialize button (glass pill removed in v3)
   Re-implemented with vanilla three.js (no React/fiber) since artifacts can't run a bundler.
   Stage order kept as DST Lubestation first (per the earlier "move it to the front" request).
   ========================================================================================== */

const STAGES = [
  { code: "01", label: "Brand Identity",             a: "Corporate", b: "Essence" },
  { code: "02", label: "Fluid Storage",               a: "Advanced",   b: "Containment" },
  { code: "03", label: "Transit & Logistics",         a: "Logistics",  b: "Network" },
  { code: "04", label: "Smart Dispensing & Control",  a: "Intelligent",b: "Metering" },
  { code: "05", label: "",                            a: "",           b: "" },
];
const CAPTIONS = [
  "Setting the standard in smart lubrication infrastructure and industrial fluid management.",
  "Heavy-duty storage systems engineered for maximum compliance, security, and containment integrity.",
  "Optimized supply chain pathways ensuring secure and efficient bulk fuel distribution across regional corridors.",
  "Integrated smart control systems delivering absolute precision in volume metering and real-time consumption tracking.",
  "",
];

/* ---------------- shapes.ts (verbatim port) ---------------- */
const COUNT = 9000;

function rng(seed){
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function fill(gen, seed){
  const r = rng(seed);
  const out = new Float32Array(COUNT * 3);
  let i = 0, guard = 0;
  while (i < COUNT && guard < COUNT * 50) {
    guard++;
    const p = gen(r);
    if (!p) continue;
    out[i*3]=p[0]; out[i*3+1]=p[1]; out[i*3+2]=p[2];
    i++;
  }
  return out;
}
function sphereDir(r){
  const u = r()*2-1, t = r()*Math.PI*2, s = Math.sqrt(1-u*u);
  return [s*Math.cos(t), u, s*Math.sin(t)];
}
function maskShape(){
  return fill((r) => {
    const y = r()*2.6 - 1.3;
    const theta = (r()*2-1)*1.35;
    const w = 1 - 0.28*Math.max(0,-y)**2*1.6 - 0.08*y*y;
    let x = Math.sin(theta)*0.95*w;
    let z = Math.cos(theta)*0.6*w;
    for (const ex of [-0.36, 0.36]) {
      const dx = (x-ex)/0.22, dy = (y-0.25)/0.08;
      if (dx*dx + dy*dy < 1) return null;
    }
    z += Math.exp(-(x*x)/0.01) * Math.max(0, 0.25-Math.abs(y+0.05)) * 1.2;
    z += Math.exp(-((y-0.42)**2)/0.004) * 0.06;
    if (r() < 0.12) x = Math.round(x*10)/10;
    return [x, y, z];
  }, 11);
}
function brainShape(){
  return fill((r) => {
    const [dx,dy,dz] = sphereDir(r);
    const side = dx >= 0 ? 1 : -1;
    const fold = 1 + 0.09*Math.sin(dx*13)*Math.sin(dy*15)*Math.sin(dz*11);
    const rad = (r() < 0.85 ? 1 : r()) * fold;
    const x = dx*0.75*rad + side*0.07;
    const y = dy*0.82*rad + 0.1;
    const z = dz*1.15*rad;
    if (y < -0.45 && Math.abs(z) > 0.3) return null;
    if (r() < 0.06) return [r()*0.16-0.08, -0.6-r()*0.6, -0.3+r()*0.2];
    return [x, y, z];
  }, 22);
}
function boneShape(){
  const a = Math.PI/4, ca = Math.cos(a), sa = Math.sin(a);
  return fill((r) => {
    let x,y,z;
    const pick = r();
    if (pick < 0.55) {
      const t = r()*2.2-1.1, ang = r()*Math.PI*2, rad = 0.16+0.04*t*t;
      x = Math.cos(ang)*rad; y = t; z = Math.sin(ang)*rad;
    } else {
      const end = pick < 0.775 ? 1 : -1;
      const lobe = r() < 0.5 ? 1 : -1;
      const [dx,dy,dz] = sphereDir(r);
      x = dx*0.28 + lobe*0.18; y = dy*0.28 + end*1.25; z = dz*0.28;
    }
    return [x*ca - y*sa, x*sa + y*ca, z];
  }, 33);
}
function skullShape(){
  return fill((r) => {
    const pick = r();
    if (pick < 0.75) {
      const [dx,dy,dz] = sphereDir(r);
      let x = dx*0.9, y = dy*0.95+0.25, z = dz*1.05;
      if (dy < -0.2) { if (dz < 0.3) return null; x *= 0.85; }
      for (const ex of [-0.33, 0.33]) {
        const ddx = (x-ex)/0.2, ddy = (y-0.05)/0.18;
        if (dz > 0.5 && ddx*ddx + ddy*ddy < 1) return null;
      }
      if (dz > 0.6 && Math.abs(x) < 0.08 && y > -0.25 && y < -0.05) return null;
      return [x, y, z];
    }
    const t = (r()*2-1)*1.4, rad = 0.6;
    const y = -0.65 + (r()-0.5)*0.2 + Math.abs(t)*0.25;
    return [Math.sin(t)*rad, y, Math.cos(t)*rad*1.1 - 0.05];
  }, 44);
}

/* ---------------- imageShape.ts (verbatim port) ---------------- */
// Trace dark ink only: the uploaded white paper never becomes particles.
// (invert: for source art that's bright lines on a dark background instead —
// e.g. the glowing map in stage 05 — trace the bright pixels instead.)
// computeMask: also classify each selected point as a thick "line" stroke (1.0) vs a thin
// "border" outline (0.0), by local ink density — used only for the stage-05 map, whose
// radiating connector lines get a separate traveling color animation from the border.
// density: fraction (0-1) of the traced ink pixels actually used as distinct particle
// positions — the rest of COUNT's slots re-land on those same reduced positions instead of
// adding new ones, so the shape reads as fewer, less tightly-packed particles (used on
// stage 01's logo, which looked too dense/merged-together on mobile at full density).
function imageShape(pixels, width, height, scale, invert, computeMask, density){
  scale = scale || 3.2;
  const inkSet = computeMask ? new Uint8Array(width * height) : null;
  let ink = [];
  for (let i = 0; i < width * height; i++) {
    const offset = i * 4;
    const brightness = ((pixels[offset] ?? 255) + (pixels[offset+1] ?? 255) + (pixels[offset+2] ?? 255)) / 3;
    const isInk = invert ? brightness > 105 : brightness < 150;
    if (isInk && (pixels[offset+3] ?? 0) > 0) {
      ink.push(i);
      if (inkSet) inkSet[i] = 1;
    }
  }
  if (ink.length === 0) return null;
  if (density && density < 1) {
    const keep = Math.max(1, Math.round(ink.length * density));
    const sparse = new Array(keep);
    for (let k = 0; k < keep; k++) sparse[k] = ink[Math.floor((k / keep) * ink.length)];
    ink = sparse;
  }
  const points = new Float32Array(COUNT * 3);
  const mask = computeMask ? new Float32Array(COUNT) : null;
  const R = 2;
  for (let i = 0; i < COUNT; i++) {
    const pixel = ink[Math.floor((i / COUNT) * ink.length)];
    if (pixel === undefined) continue;
    points[i*3] = ((pixel % width) / width - 0.5) * scale;
    points[i*3+1] = (0.5 - Math.floor(pixel / width) / height) * scale * height / width;
    points[i*3+2] = 0;
    if (inkSet) {
      const px = pixel % width, py = Math.floor(pixel / width);
      let neighborInk = 0, total = 0;
      for (let dy = -R; dy <= R; dy++) {
        const ny = py + dy;
        if (ny < 0 || ny >= height) continue;
        for (let dx = -R; dx <= R; dx++) {
          const nx = px + dx;
          if (nx < 0 || nx >= width) continue;
          total++;
          if (inkSet[ny * width + nx]) neighborInk++;
        }
      }
      mask[i] = (total > 0 && neighborInk / total > 0.6) ? 1.0 : 0.0;
    }
  }
  return computeMask ? { points, mask } : points;
}

/* ---------------- ParticleField.tsx (verbatim shaders, v3 color cycle + uDim) ---------------- */
const vertex = `
uniform float uProgress; uniform float uTime; uniform vec3 uMouse; uniform float uPR; uniform float uDim; uniform float uJitterAmp; uniform float uMobile;
uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uColorC;
uniform vec3 uLineColorA; uniform vec3 uLineColorB; uniform vec3 uLineColorC;
attribute vec3 p0; attribute vec3 p1; attribute vec3 p2; attribute vec3 p3; attribute vec3 p4; attribute float aRand; attribute float aLineMask;
varying vec3 vColor; varying float vAlpha;
float ease(float t){ return t*t*(3.0-2.0*t); }
void main(){
  float s = clamp(uProgress, 0.0, 4.0);
  vec3 pos;
  if (s < 1.0) pos = mix(p0, p1, ease(s));
  else if (s < 2.0) pos = mix(p1, p2, ease(s-1.0));
  else if (s < 3.0) pos = mix(p2, p3, ease(s-2.0));
  else pos = mix(p3, p4, ease(s-3.0));
  float trans = sin(fract(s) * 3.14159);
  vec3 jit = normalize(vec3(sin(aRand*91.0), cos(aRand*57.0), sin(aRand*23.0)) + 0.001);
  pos += jit * trans * (0.3 + aRand * 0.7);
  pos += jit * 0.015 * uJitterAmp * sin(uTime * 2.0 + aRand * 40.0);
  vec4 world = modelMatrix * vec4(pos, 1.0);
  vec2 d = world.xy - uMouse.xy;
  float dist = length(d);
  float force = smoothstep(0.255, 0.0, dist);
  world.xy += normalize(d + 0.0001) * force * 0.55;
  world.z += force * 0.4;
  vec4 mv = viewMatrix * world;
  gl_Position = projectionMatrix * mv;
  // Stage 05's radiating connector lines "travel" through 3 colors outward from the map's
  // center, instead of following the regular scene-wide cycle used by everything else, and
  // render 20% smaller (thinner) than the rest of the traced shape.
  float lineActive = aLineMask * smoothstep(3.3, 3.8, s);
  // Mobile only: stage 01's own lines (the logo) render 45% thinner, and stages 02-04 (the
  // storage box, the truck, the gauge monitor) each render 40% thinner; each fades back to
  // normal thickness as the shape morphs into/out of its neighbor.
  float stage1Weight = s < 1.0 ? (1.0 - ease(s)) : 0.0;
  float stage2Weight = s < 1.0 ? ease(s) : (s < 2.0 ? (1.0 - ease(s - 1.0)) : 0.0);
  float stage3Weight = s < 1.0 ? 0.0 : (s < 2.0 ? ease(s - 1.0) : (s < 3.0 ? (1.0 - ease(s - 2.0)) : 0.0));
  float stage4Weight = s < 2.0 ? 0.0 : (s < 3.0 ? ease(s - 2.0) : (s < 4.0 ? (1.0 - ease(s - 3.0)) : 0.0));
  float stage1Thin = mix(1.0, 0.55, stage1Weight * uMobile);
  float stage2Thin = mix(1.0, 0.6, stage2Weight * uMobile);
  float stage3Thin = mix(1.0, 0.6, stage3Weight * uMobile);
  float stage4Thin = mix(1.0, 0.6, stage4Weight * uMobile);
  // Map (stage 05) connector lines: already 20% thinner than the border, now another 40%
  // thinner on top of that.
  gl_PointSize = (1.4 + aRand * 2.2) * uPR * (7.0 / -mv.z) * (1.0 + force) * (1.0 - lineActive * 0.2) * (1.0 - lineActive * 0.4) * stage1Thin * stage2Thin * stage3Thin * stage4Thin;
  float t = fract(uTime * 0.06 + aRand * 0.25 + pos.y * 0.18 + s * 0.15) * 4.0;
  vec3 c = t < 1.0 ? mix(uColorA, uColorB, t) : (t < 2.0 ? mix(uColorB, uColorA, t-1.0) : (t < 3.0 ? mix(uColorA, uColorC, t-2.0) : mix(uColorC, uColorA, t-3.0)));
  if (lineActive > 0.0) {
    float lt = fract(uTime * 0.35 - length(pos.xy) * 0.9) * 3.0;
    vec3 lc = lt < 1.0 ? mix(uLineColorA, uLineColorB, lt) : (lt < 2.0 ? mix(uLineColorB, uLineColorC, lt-1.0) : mix(uLineColorC, uLineColorA, lt-2.0));
    c = mix(c, lc, lineActive);
  }
  vColor = mix(c, vec3(1.0), force * 0.5);
  vAlpha = (0.55 + aRand * 0.45) * uDim;
}`;
const fragment = `
varying vec3 vColor; varying float vAlpha;
void main(){
  float d = length(gl_PointCoord - 0.5);
  if (d > 0.5) discard;
  float a = smoothstep(0.5, 0.0, d);
  gl_FragColor = vec4(vColor, a * vAlpha);
}`;

/* ---------------- scene setup ---------------- */
const canvas = document.getElementById("field");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(0, 0, 4.2);

const group = new THREE.Group();
scene.add(group);

const geometry = new THREE.BufferGeometry();
const p0 = skullShape(); // temporary fallback for stage 01 until the wordmark image decodes
geometry.setAttribute("position", new THREE.BufferAttribute(p0.slice(), 3));
geometry.setAttribute("p0", new THREE.BufferAttribute(p0, 3));
geometry.setAttribute("p1", new THREE.BufferAttribute(skullShape(), 3)); // temporary fallback for stage 02 until the logo image decodes
geometry.setAttribute("p2", new THREE.BufferAttribute(brainShape(), 3));
geometry.setAttribute("p3", new THREE.BufferAttribute(boneShape(), 3));
geometry.setAttribute("p4", new THREE.BufferAttribute(maskShape(), 3)); // temporary fallback for stage 05 until the map image decodes
const randAttr = new Float32Array(COUNT);
for (let i=0;i<COUNT;i++) randAttr[i] = ((i*2654435761) % 1000) / 1000;
geometry.setAttribute("aRand", new THREE.BufferAttribute(randAttr, 1));
geometry.setAttribute("aLineMask", new THREE.BufferAttribute(new Float32Array(COUNT), 1)); // 1.0 = stage-05 radiating line, set once that image decodes
geometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 4);

/* Both p0 and p1 start as the skull fallback, then swap to their traced logo
   once each image decodes — exactly like the useEffect in ParticleField.tsx.
   withMask: also classify stage-05's radiating lines vs. its border outline (see imageShape). */
function loadLogoInto(attrName, url, scale, invert, withMask, density){
  const image = new Image();
  image.crossOrigin = "anonymous";
  image.onload = () => {
    const c = document.createElement("canvas");
    c.width = 800;
    c.height = Math.round(800 * image.naturalHeight / image.naturalWidth);
    const ctx = c.getContext("2d", { willReadFrequently: true });
    if (!ctx) return;
    ctx.drawImage(image, 0, 0, c.width, c.height);
    const result = imageShape(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, scale, invert, withMask, density);
    if (!result) return;
    if (withMask) {
      geometry.setAttribute(attrName, new THREE.BufferAttribute(result.points, 3));
      geometry.setAttribute("aLineMask", new THREE.BufferAttribute(result.mask, 1));
    } else {
      geometry.setAttribute(attrName, new THREE.BufferAttribute(result, 3));
    }
  };
  image.src = url;
}
loadLogoInto("p0", "assets/dst-logo-outline.png", 3.2 * 1.3 * 0.9, false, false, 0.8); // stage 01 "Brand Identity" — 30% bigger, then -10%; -20% particle density (was too dense/merged on mobile)
loadLogoInto("p1", "assets/dst-lubestation.jpg");               // stage 02 "Fluid Storage"

const uniforms = {

const material = new THREE.ShaderMaterial({

/* ---------------- EXPERIMENTAL: orbiting particle spheres around stages 01 & 02 ----------------
   Four concentric shells of points that spin together around the current shape at a slow,
   constant speed. Children of `group` (so they scale/position with whichever shape is on
   screen) but fade in/out on their own so they're only visible while stage 01 ("Corporate
   Essence" logo) or stage 02 ("Fluid Storage") is showing. While scrolling from 01 into 02,
   the whole set grows continuously larger, so it reads as flying toward the spheres' center. */
const ORBIT_COUNT = Math.round(1400 * 1.3 * 1.35);  // +30%, then +35% more (page-1 sphere set)
const ORBIT_RADIUS = 2.3 * 0.8;              // -20%
const ORBIT_SIZE = 0.028 * 0.5;              // -50%
// Three inner layers (10% / 20% / 30% smaller than the base), each then +15% bigger;
// the outer/largest layer is +25% bigger instead.
const ORBIT_LAYER_RADII = [
  ORBIT_RADIUS * 1.25,
  ORBIT_RADIUS * 0.9 * 1.15,
  ORBIT_RADIUS * 0.8 * 1.15,
  ORBIT_RADIUS * 0.7 * 1.15,
];
// Base rotation speed (rad/s) all layers used to share before they were each given their own
// rate; "سفر اول" below means ORBIT_LAYER_RADII[0], the largest/outer ellipsoid.
const ORBIT_BASE_SPEED = { y: 0.2, x: 0.072 };
const orbitSpeed1 = 0.8;              // layer 1 (largest): -20%
// layer speed multipliers, relative to layer 1's (already -20%) speed:
const ORBIT_LAYER_SPEED_MULT = [
  1,     // layer 1 (largest ellipsoid): base for the others below
  1,     // layer 2: same speed as layer 1
  0.9,   // layer 3: -10% vs layer 1
  0.8,   // layer 4: -20% vs layer 1
];

const orbitGroup = new THREE.Group();
group.add(orbitGroup);
const orbitMaterials = [];
const orbitShells = []; // { mesh, speed: {y,x} } — each layer spins at its own rate
let orbitSeed = 918273;
const orbitRnd = () => { orbitSeed = (orbitSeed * 1103515245 + 12345) % 2147483648; return orbitSeed / 2147483648; };
// PointsMaterial renders square sprites by default; give every orbit particle (in every
// sphere, on every page/stage) a soft round sprite instead so none of them look square.
const orbitDotTexture = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const ctx = c.getContext("2d");
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.5, "rgba(255,255,255,0.6)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(32, 32, 32, 0, Math.PI * 2);
  ctx.fill();
  return new THREE.CanvasTexture(c);
})();
function makeOrbitShell(radius, scaleXYZ, targetGroup, targetMaterials, count){
  targetGroup = targetGroup || orbitGroup;
  targetMaterials = targetMaterials || orbitMaterials;
  count = count || ORBIT_COUNT;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = orbitRnd() * Math.PI * 2;
    const phi = Math.acos(2 * orbitRnd() - 1);
    const r = radius + (orbitRnd() - 0.5) * 0.12; // thin shell, not a flat ring
    pos[i*3]   = Math.sin(phi) * Math.cos(theta) * r;
    pos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r;
    pos[i*3+2] = Math.cos(phi) * r;
  }
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), radius + 0.2);
  const mat = new THREE.PointsMaterial({
    size: ORBIT_SIZE,
    map: orbitDotTexture,
    color: new THREE.Color(1.0, 0.86, 0.4), // gold, matching the scene's palette
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  });
  targetMaterials.push(mat);
  const shell = new THREE.Points(geo, mat);
  if (scaleXYZ) shell.scale.set(...scaleXYZ);
  targetGroup.add(shell);
  return shell;
}
ORBIT_LAYER_RADII.forEach((radius, layerIx) => {
  // Largest/outer layer only: stretched into an ellipsoid so its particles spread across
  // more of the screen instead of reading as a perfectly round sphere.
  // Spheres 1, 2 and 3 (layerIx 0-2) get +40% more particles than layer 4.
  const count = layerIx < 3 ? Math.round(ORBIT_COUNT * 1.4) : ORBIT_COUNT;
  const shell = makeOrbitShell(radius, layerIx === 0 ? [1.4, 1.15, 1.0] : null, null, null, count);
  const mult = ORBIT_LAYER_SPEED_MULT[layerIx];
  orbitShells.push({ mesh: shell, speed: { y: ORBIT_BASE_SPEED.y * orbitSpeed1 * mult, x: ORBIT_BASE_SPEED.x * orbitSpeed1 * mult } });
});
// A second ellipsoid, complementary to the first (stretched on the opposite axis so the two
// cross one another), 10% bigger than layer 1, spinning 30% slower than layer 1.
const ellipse2Radius = ORBIT_LAYER_RADII[0] * 1.1;
const ellipse2 = makeOrbitShell(ellipse2Radius, [1.0, 1.4, 1.15]);
orbitShells.push({
  mesh: ellipse2,
  speed: { y: ORBIT_BASE_SPEED.y * orbitSpeed1 * 0.7, x: ORBIT_BASE_SPEED.x * orbitSpeed1 * 0.7 },
});

/* ---------------- EXPERIMENTAL: a second orbit set, around stage 02's shape only ----------------
   Three more sphere layers, all the same size as stage 01's smallest sphere (layer 4 above),
   orbiting only while stage 02 ("Fluid Storage") is on screen — on top of (in addition to)
   the shared 5-object set above, which already covers stage 01 through stage 02. */
const ORBIT2_RADIUS = ORBIT_LAYER_RADII[3] * 1.2; // stage 01's smallest sphere, +20%
const ORBIT2_COUNT = Math.round(1400 * 1.3); // kept at the page-1 set's pre-+35% density
const orbit2Group = new THREE.Group();
group.add(orbit2Group);
const orbit2Materials = [];
const orbit2Shells = [];
const ORBIT2_SPEED_MULT = [1, 0.85, 0.7]; // a little variety between the 3 layers
for (let i = 0; i < 3; i++) {
  const shell = makeOrbitShell(ORBIT2_RADIUS, null, orbit2Group, orbit2Materials, ORBIT2_COUNT);
  const mult = ORBIT2_SPEED_MULT[i];
  orbit2Shells.push({ mesh: shell, speed: { y: ORBIT_BASE_SPEED.y * mult, x: ORBIT_BASE_SPEED.x * mult } });
}

/* ---------------- Halo (v3): a soft, non-morphing ambient particle sphere ---------------- */
const HALO = 3500;
const haloGeometry = new THREE.BufferGeometry();
{
  const pos = new Float32Array(HALO * 3);
  const rand = new Float32Array(HALO);
  let seed = 1234567;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  for (let i = 0; i < HALO; i++) {
    const theta = rnd() * Math.PI * 2;
    const phi = Math.acos(2 * rnd() - 1);
    const r = 1.9 + Math.pow(rnd(), 1.4) * 1.9;
    pos[i*3]   = Math.sin(phi) * Math.cos(theta) * r * 1.5;
    pos[i*3+1] = Math.sin(phi) * Math.sin(theta) * r * 1.05;
    pos[i*3+2] = Math.cos(phi) * r * 0.7;
    rand[i] = rnd();
  }
  const attr = new THREE.BufferAttribute(pos, 3);
  haloGeometry.setAttribute("position", attr);
  haloGeometry.setAttribute("p0", attr);
  haloGeometry.setAttribute("p1", attr);
  haloGeometry.setAttribute("p2", attr);
  haloGeometry.setAttribute("p3", attr);
  haloGeometry.setAttribute("p4", attr);
  haloGeometry.setAttribute("aRand", new THREE.BufferAttribute(rand, 1));
  haloGeometry.setAttribute("aLineMask", new THREE.BufferAttribute(new Float32Array(HALO), 1)); // halo never has lines; stays 0
  haloGeometry.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 6);
}
const haloUniforms = {
  uProgress: { value: 0 },
  uTime: { value: 0 },
  uMouse: { value: new THREE.Vector3(99, 99, 0) },
  uPR: { value: Math.min(renderer.getPixelRatio(), 2) },
  uDim: { value: 0.456 }, // 20% brighter than the original 0.38
  uMobile: { value: 0 }, // unused here (halo isn't stage-specific) but shares the vertex shader
  uJitterAmp: { value: 1.5 }, // 50% larger idle-motion amplitude
  // Background halo cycles only between bright and matte yellow (uColorC == uColorA
  // collapses the shared 3-stop cycle formula down to a clean two-tone pulse).
  uColorA: { value: new THREE.Color(0.55, 0.5, 0.18) },  // matte yellow
  uColorB: { value: new THREE.Color(1.0, 0.95, 0.25) },  // bright yellow
  uColorC: { value: new THREE.Color(0.55, 0.5, 0.18) },  // matte yellow
  // aLineMask is always 0 for halo particles, so these are never actually blended in.
  uLineColorA: { value: new THREE.Color(0, 0, 0) },
  uLineColorB: { value: new THREE.Color(0, 0, 0) },
  uLineColorC: { value: new THREE.Color(0, 0, 0) },
};
const haloMaterial = new THREE.ShaderMaterial({
  vertexShader: vertex,
  fragmentShader: fragment,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: haloUniforms,
});
const halo = new THREE.Points(haloGeometry, haloMaterial);
scene.add(halo); // sibling of `group`, not inside it — stays put while the main shape scales/rotates

/* ---------------- pointer (mouse.current equivalent) ---------------- */
const mouse = { x: 5, y: 5 };
function onMove(e){
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
function onLeave(){ mouse.x = 5; mouse.y = 5; }
window.addEventListener("pointermove", onMove, { passive:true });
document.addEventListener("pointerleave", onLeave);

/* ---------------- resize ---------------- */
function resize(){
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

/* ---------------- scroll-driven progress (Hero.tsx) ---------------- */
const heroStage = document.getElementById("heroStage");
const progress = { current: 0 };
let stageIx = -1;

// The raw scroll fraction morphs continuously and never actually holds still on a shape.
// To make each stage visibly "land" and stay on its shape, most of a stage's scroll range
// (HOLD_FRAC) keeps the shape fixed; only the remaining tail actually morphs to the next one.
const HOLD_FRAC = 0.55;
const MAX_STAGE = 4; // 5 stages (indices 0-4), 4 morph segments
function stagedProgress(p){
  const clamped = Math.min(MAX_STAGE, Math.max(0, p));
  const i = Math.min(MAX_STAGE - 1, Math.floor(clamped)); // segments only exist between 0-1, 1-2, ... (MAX_STAGE-1)-MAX_STAGE
  const f = clamped - i;
  if (clamped >= MAX_STAGE) return MAX_STAGE;
  const t = f < HOLD_FRAC ? 0 : (f - HOLD_FRAC) / (1 - HOLD_FRAC);
  const eased = t * t * (3 - 2 * t);
  return i + eased;
}

function onScroll(){
  const max = heroStage.offsetHeight - window.innerHeight;
  const p = Math.min(Math.max(-heroStage.getBoundingClientRect().top / max, 0), 1) * MAX_STAGE;
  progress.current = stagedProgress(p);
  const clamped = Math.min(MAX_STAGE, Math.max(0, p));
  const i = Math.min(MAX_STAGE, Math.floor(clamped));
  const f = clamped - i;
  const rounded = f < HOLD_FRAC ? i : Math.min(MAX_STAGE, i + 1);
  if (rounded !== stageIx) renderStage(rounded);
  scrollCue.style.opacity = rounded === MAX_STAGE ? "0" : "0.7";
  scheduleSnapCheck();
}
window.addEventListener("scroll", onScroll, { passive:true });

/* If the user stops scrolling while sitting inside the quick-morph tail of a segment
   (the last (1-HOLD_FRAC) of its range), the shape is left mid-blend between two images.
   Once scrolling has been idle for a moment, finish the move to the next clear shape. */
let snapTimer = null;
function scheduleSnapCheck(){
  clearTimeout(snapTimer);
  snapTimer = setTimeout(trySnap, 160);
}
function trySnap(){
  const max = heroStage.offsetHeight - window.innerHeight;
  const pLinear = Math.min(Math.max(-heroStage.getBoundingClientRect().top / max, 0), 1) * MAX_STAGE;
  if (pLinear <= 0 || pLinear >= MAX_STAGE) return;
  const i = Math.min(MAX_STAGE - 1, Math.floor(pLinear));
  const f = pLinear - i;
  if (f >= HOLD_FRAC && f < 1) {
    const targetP = Math.min(MAX_STAGE, i + 1);
    const targetY = heroStage.offsetTop + (targetP / MAX_STAGE) * max;
    window.scrollTo({ top: targetY, behavior: "smooth" });
  }
}

/* ---------------- stage text / caption (Hero.tsx) ---------------- */
const sideNav = document.getElementById("sideNav");

/* ---------------- mobile hamburger menu ---------------- */
const navToggle = document.getElementById("navToggle");
const mobileNav = document.getElementById("mobileNav");
navToggle.addEventListener("click", () => {
  const open = mobileNav.classList.toggle("open");
  navToggle.classList.toggle("open", open);
  navToggle.setAttribute("aria-expanded", String(open));
});
mobileNav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
  mobileNav.classList.remove("open");
  navToggle.classList.remove("open");
  navToggle.setAttribute("aria-expanded", "false");

const kicker = document.getElementById("kicker");
const kickerCode = document.getElementById("kickerCode");
const kickerLabel = document.getElementById("kickerLabel");
const heroTitle = document.getElementById("heroTitle");
const titleA = document.getElementById("titleA");
const titleB = document.getElementById("titleB");
const captionText = document.getElementById("captionText");
const scrollCue = document.getElementById("scrollCue");

// Per-request 30% size reductions for specific stage strings only:
// "Corporate Essence" (01), "Advanced Containment" (02), "Logistics Network" (03) titles,
// and the "Transit & Logistics" (03) kicker label — every other string keeps its default size.
const SHRUNK_TITLE_STAGES = [0, 1, 2];
const SHRUNK_LABEL_STAGES = [2];
const TITLE_FONT_SIZE_SHRUNK = "clamp(1.344rem, 5.04vw, 3.36rem)"; // 70% of the default clamp
const LABEL_FONT_SIZE_SHRUNK = "7px"; // 70% of the default 10px

function renderStage(ix){
  stageIx = ix;
  const s = STAGES[ix];
  kickerCode.textContent = s.code;
  kickerLabel.textContent = s.label;
  kickerLabel.style.fontSize = SHRUNK_LABEL_STAGES.includes(ix) ? LABEL_FONT_SIZE_SHRUNK : "";
  heroTitle.style.fontSize = SHRUNK_TITLE_STAGES.includes(ix) ? TITLE_FONT_SIZE_SHRUNK : "";
  heroTitle.classList.remove("show");
  captionText.classList.remove("show");
  window.requestAnimationFrame(() => {
    titleA.textContent = s.a;
    titleB.textContent = s.b;
    captionText.textContent = CAPTIONS[ix];
    window.requestAnimationFrame(() => {
      heroTitle.classList.add("show");
      captionText.classList.add("show");
    });
  });
}

requestAnimationFrame(() => {
  [kicker, sideNav].forEach(el => el.classList.add("show"));
  renderStage(0);
  heroTitle.classList.add("show");
  captionText.classList.add("show");
  onScroll();
});

/* ---------------- render loop (ParticleField.tsx useFrame) ---------------- */
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let cur = 0;

// r3f's `viewport`: the visible plane size (world units) at z=0 for the current camera.
function viewportAtOrigin(){
  const vFov = (camera.fov * Math.PI) / 180;
  const height = 2 * Math.tan(vFov / 2) * camera.position.z;
  const width = height * camera.aspect;
  return { width, height };
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  cur += (progress.current - cur) * (1 - Math.exp(-4 * dt));
  uniforms.uProgress.value = cur;
  uniforms.uTime.value = t;
  haloUniforms.uTime.value = t;

  tmp.set(mouse.x, mouse.y, 0.5).unproject(camera);
  tmp.sub(camera.position).normalize();
  const tt = -camera.position.z / tmp.z;
  const target = camera.position.clone().add(tmp.multiplyScalar(tt));
  uniforms.uMouse.value.lerp(target, 1 - Math.exp(-12 * dt));
  haloUniforms.uMouse.value.copy(uniforms.uMouse.value);

  const sizeWidth = canvas.clientWidth || window.innerWidth;
  const vp = viewportAtOrigin();
  const compact = sizeWidth < 600;
  // Mobile only: the traced images (every stage) are dimmed 20% dimmer than on desktop.
  uniforms.uDim.value = compact ? 0.8 : 1.0;
  uniforms.uMobile.value = compact ? 1 : 0;
  // All four stages are now flat traced logos (wordmark, Lubestation box, truck, device),
  // so the "flat image" scale/rotation treatment applies across the whole scroll range.
  const imageStage = 1;
  const imageScale = Math.min((vp.width * 0.88) / 3.2, (vp.height * (compact ? 0.3 : 0.65)) / 2.45, 1);
  group.scale.setScalar(THREE.MathUtils.lerp(1, imageScale, imageStage));
  group.position.y = compact ? vp.height * 0.14 * imageStage : 0; // moved 10% of viewport height lower on mobile

  const inside = Math.abs(mouse.x) <= 1 && Math.abs(mouse.y) <= 1;
  const rotationScale = 1 - imageStage * 0.85;
  group.rotation.y += (((inside ? mouse.x * 0.35 : 0) + Math.sin(t * 0.3) * 0.15) * rotationScale - group.rotation.y) * (1 - Math.exp(-2 * dt));
  group.rotation.x += ((inside ? -mouse.y * 0.2 * rotationScale : 0) - group.rotation.x) * (1 - Math.exp(-2 * dt));

  // Orbit spheres: each layer spins at its own rate (see ORBIT_LAYER_SPEED_MULT), independent
  // of the shape's own rotation. Visible across stage 01 ("Corporate Essence" logo) through
  // stage 05 (the map), growing continuously bigger from 01 into 02 (s: 0 -> 1, reading as
  // flying toward the spheres' center), then a further +30% growth spurt for each stage
  // transition after that (02->03, 03->04, 04->05) — applies to every sphere, both orbit sets.
  for (const { mesh, speed } of orbitShells) {
    mesh.rotation.y += speed.y * dt;
    mesh.rotation.x += speed.x * dt;
  }
  const orbitVisible = cur <= 4 ? 1 : THREE.MathUtils.clamp(1 - (cur - 4) * 2, 0, 1);
  for (const mat of orbitMaterials) mat.opacity = orbitVisible * 0.8;
  // Desktop only: spheres 1, 2 and 3 (the outer ellipsoid plus the next two layers) glow 40%
  // brighter — layer 4 and the second ellipse are left at their normal brightness.
  const orbitBrightBoost = compact ? 1.0 : 1.4;
  for (let i = 0; i < 3; i++) {
    orbitMaterials[i].color.setRGB(1.0 * orbitBrightBoost, 0.86 * orbitBrightBoost, 0.4 * orbitBrightBoost);
  }
  const orbitGrowth = THREE.MathUtils.lerp(1.0, 2.2, THREE.MathUtils.clamp(cur / 1, 0, 1));
  const growthSpurt = THREE.MathUtils.lerp(1.0, 1.3, THREE.MathUtils.clamp(cur - 1, 0, 1)); // +30% across s: 1 -> 2
  const growthSpurt2 = THREE.MathUtils.lerp(1.0, 1.3, THREE.MathUtils.clamp(cur - 2, 0, 1)); // +30% across s: 2 -> 3
  const growthSpurt3 = THREE.MathUtils.lerp(1.0, 1.3, THREE.MathUtils.clamp(cur - 3, 0, 1)); // +30% across s: 3 -> 4
  orbitGroup.scale.setScalar(orbitGrowth * growthSpurt * growthSpurt2 * growthSpurt3);

  // Second orbit set: around stages 02 through 05 (fades in approaching 02).
  for (const { mesh, speed } of orbit2Shells) {
    mesh.rotation.y += speed.y * dt;
    mesh.rotation.x += speed.x * dt;
  }
  const orbit2Visible = THREE.MathUtils.clamp((cur - 0.5) * 2, 0, 1);
  for (const mat of orbit2Materials) mat.opacity = orbit2Visible * 0.8;
  orbit2Group.scale.setScalar(growthSpurt * growthSpurt2 * growthSpurt3);

  renderer.render(scene, camera);
}
animate();
